name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Validate, Typecheck, Test & Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?pgbouncer=true
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SESSION_SECRET: test_session_secret_32_chars_minimum_length_required_ci
      PROVIDER_ENCRYPTION_KEY: test_encryption_key_32_chars_minimum_length_ci
      INTERNAL_JOB_SECRET: test_internal_job_secret_for_ci_pipeline
      STRIPE_SECRET_KEY: sk_test_mock_stripe_key_for_ci_suite

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Full Regression Suite
        run: npm test

      - name: Build Next.js Application
        run: npm run build
